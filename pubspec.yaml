name: kovoit
description: "Kovoit - covoiturage urbain a Lome"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0

  # Réseau & stockage
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6 # préférences non sensibles (recherches récentes)

  # Cartographie OpenStreetMap
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Authentification
  google_sign_in: ^7.2.0

  # Capture des pièces KYC (photo / galerie)
  image_picker: ^1.2.4

  # Sérialisation (DTO)
  json_annotation: ^4.12.0

  # Utilitaires
  intl: 0.20.2 # version imposée par flutter_localizations
  logger: ^2.8.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  build_runner: ^2.15.1
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
